[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]

# Migracion historica aplicada: conservar su contenido (AGENTS.md, append-only).
[tool.ruff.lint.per-file-ignores]
"alembic/versions/5997a757f17b_modulo3_licitud_persistencia.py" = ["I001"]
# DDL congelado y aplicado: conservar los espacios del SQL compilado.
"alembic/versions/b84e9f1a5c32_child_eipd_successors.py" = ["W291"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
